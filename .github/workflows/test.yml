# Manual only (owner's decision: this workflow runs by hand, never on push,
# pull request or a schedule). Start it with
#   gh workflow run test.yml -R ubgo/appdir --ref main
# or the "Run workflow" button. Do not add other triggers.
#
# What it proves that a Linux laptop cannot: the Windows ACL, LockFileEx,
# MoveFileEx, named-pipe and USERPROFILE paths, the macOS /var ->
# /private/var temp folders and socket fallback, and a legacy move across two
# real filesystems (APPDIR_TEST_SECOND_DISK, see docs/testing/ci.md).

name: test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple silicon; macos-15-intel is the Intel image
        # (macos-13 was retired by GitHub in December 2025).
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      # Every package in the module: the library, internal/flock,
      # internal/jsonclite and the examples (each has its own tests).
      - name: go test
        run: go test -count=1 ./...

      # The same set as `task test:race:concurrency`: only the packages with
      # real concurrency. The race detector runs on linux/amd64,
      # darwin/amd64, darwin/arm64 and windows/amd64, so every runner here.
      - name: go test -race (concurrency set)
        env:
          CGO_ENABLED: "1"
        run: |
          go test -race -count=1 ./internal/flock/...
          go test -race -count=1 -run 'Legacy|Lock|Concurren' .

      # A second filesystem for the cross-disk legacy move. The test only runs
      # when APPDIR_TEST_SECOND_DISK names a folder on another volume than
      # the temp folder, so it never runs on a laptop by accident.
      - name: second disk (Linux tmpfs)
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /mnt/appdir2
          sudo mount -t tmpfs -o size=64m tmpfs /mnt/appdir2
          sudo chown "$(id -u):$(id -g)" /mnt/appdir2
          echo "APPDIR_TEST_SECOND_DISK=/mnt/appdir2" >> "$GITHUB_ENV"
      - name: second disk (macOS RAM disk)
        if: runner.os == 'macOS'
        run: |
          dev="$(hdiutil attach -nomount ram://131072 | awk '{print $1}')"
          diskutil erasevolume HFS+ appdir2 "$dev"
          echo "APPDIR_TEST_SECOND_DISK=/Volumes/appdir2" >> "$GITHUB_ENV"
      - name: second disk (Windows D:)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path 'D:\')) { Write-Error 'no D: drive on this runner'; exit 1 }
          New-Item -ItemType Directory -Force -Path 'D:\appdir2' | Out-Null
          "APPDIR_TEST_SECOND_DISK=D:\appdir2" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "TEMP is $env:TEMP"

      # -v so the log shows the test ran (PASS), not SKIP.
      - name: cross-disk legacy move
        run: |
          echo "APPDIR_TEST_SECOND_DISK=$APPDIR_TEST_SECOND_DISK"
          go test -count=1 -run XDisk -v . | tee xdisk.log
          grep -q -- '--- PASS: .*XDisk' xdisk.log || { echo "no XDisk test passed"; exit 1; }
          if grep -q -- '--- SKIP: .*XDisk' xdisk.log; then echo "an XDisk test was skipped"; exit 1; fi
